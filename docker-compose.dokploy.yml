# Dokploy Compose stack — postgres + rustfs + migrate + backend
#
# Dokploy setup:
# 1. Compose path: ./docker-compose.dokploy.yml
# 2. Domains tab → service name exactly `backend`, port `8000`, HTTPS on
#    (plain "404 page not found" = Traefik miss — wrong service/port/domain)
# 3. Optional domain → service `rustfs`, port `9000` for public image URLs;
#    set RUSTFS_SERVER_DOMAINS / RUSTFS_PUBLIC_BASE_URL to match
# 4. Fill Environment tab with required vars below (written to .env)
# 5. Do not publish Postgres host ports
#
# Required env:
#   POSTGRES_PASSWORD, SECRET_KEY, RUSTFS_ACCESS_KEY, RUSTFS_SECRET_KEY
#
# Optional:
#   POSTGRES_DB (default brolier_360), POSTGRES_USER (default postgres)
#   ALLOWED_HOSTS / CORS_ORIGINS — default * (ok while PRODUCTION=False)
#   PRODUCTION — default False; True requires explicit non-wildcard hosts/CORS
#   RUSTFS_SERVER_DOMAINS (default rustfs:9000)
#   RUSTFS_PUBLIC_BASE_URL, RUSTFS_PUBLIC_READ_ENABLED
#
# DATABASE_URL is always built to host `postgres` (never localhost).
# Avoid URL-unsafe characters in POSTGRES_PASSWORD.

name: brolier360-dokploy

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-env: &backend-env
  APP_NAME: ${BACKEND_APP_NAME:-Brolier 360 API}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
  # Always use in-compose Postgres hostname (local .env localhost URLs break here).
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-brolier_360}
  PRODUCTION: ${PRODUCTION:-False}
  # Include your API hostname in Dokploy env, or keep * while PRODUCTION=False.
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
  CORS_ORIGINS: ${CORS_ORIGINS:-*}
  RUSTFS_ENDPOINT_URL: ${RUSTFS_ENDPOINT_URL:-http://rustfs:9000}
  RUSTFS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY}
  RUSTFS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY}
  RUSTFS_BUCKET_NAME: ${RUSTFS_BUCKET_NAME:-brolier-360}
  RUSTFS_SERVER_DOMAINS: ${RUSTFS_SERVER_DOMAINS:-rustfs:9000}
  RUSTFS_S3_HOST_HEADER: ${RUSTFS_S3_HOST_HEADER:-}
  RUSTFS_REGION_NAME: ${RUSTFS_REGION_NAME:-us-east-1}
  RUSTFS_PUBLIC_BASE_URL: ${RUSTFS_PUBLIC_BASE_URL:-}
  RUSTFS_PUBLIC_READ_ENABLED: ${RUSTFS_PUBLIC_READ_ENABLED:-False}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-["172.16.0.0/12","10.0.0.0/8","192.168.0.0/16"]}
  TRUST_X_FORWARDED_PROTO: ${TRUST_X_FORWARDED_PROTO:-True}
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
  DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
  DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brolier_360}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-120}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  rustfs:
    build:
      context: ./rustfs
      dockerfile: Dockerfile
      target: runtime
      args:
        RUSTFS_VERSION: ${RUSTFS_VERSION:-1.0.0-beta.8}
    restart: unless-stopped
    logging: *default-logging
    init: true
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    networks:
      - internal
      - dokploy-network
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: ${RUSTFS_CONSOLE_ENABLE:-false}
      RUSTFS_SERVER_DOMAINS: ${RUSTFS_SERVER_DOMAINS:-rustfs:9000}
    volumes:
      - rustfs_data:/data
    tmpfs:
      - /logs:size=64M,uid=10001,gid=10001,mode=1777
    expose:
      - "9000"
    command:
      - --address
      - :9000
      - --server-domains
      - ${RUSTFS_SERVER_DOMAINS:-rustfs:9000}
      - /data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -o /dev/null http://127.0.0.1:9000/health || wget -qO- http://127.0.0.1:9000/health >/dev/null",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    logging: *default-logging
    init: true
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *backend-env
      # Migrations only — skip production host/CORS validators.
      PRODUCTION: "False"
    command: ["python", "migrate.py", "--tenants"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    init: true
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp/app:size=128M,mode=1777,uid=10001,gid=10001
    networks:
      - internal
      - dokploy-network
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *backend-env
    # Publish container port so Dokploy/Traefik can target it (Domains → backend:8000).
    ports:
      - "8000"
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\"",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  postgres_data:
  rustfs_data:
